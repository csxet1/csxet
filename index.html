<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مختبر البصريات النظرية – الفصل الأول</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe4;--panel:#fffdf6;--ink:#1d2433;--mute:#5d6577;--line:#cfc8b4;--acc:#1f8a5b;--hot:#d6442f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--panel:#161e35;--ink:#e8ecf7;--mute:#97a1bd;--line:#2c3860;--acc:#5ef0a8;--hot:#ff7a5c}}
*{box-sizing:border-box}html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;line-height:1.6}
#home{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:8px 0 4px;font-weight:800}
.sub{color:var(--mute);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{font:inherit;color:inherit;text-align:center;background:var(--panel);border:3px solid var(--line);padding:14px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:4px 4px 0 var(--line)}
.tile:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.tile:focus-visible,#back:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.tile svg{width:84px;height:84px;image-rendering:pixelated;shape-rendering:crispEdges}
.tile b{font-size:1.05rem}.tile small{color:var(--mute)}.tile .n{color:var(--acc);font-weight:800}
.tile[disabled]{opacity:.55;cursor:default;box-shadow:none}
#view{display:none;height:100%;flex-direction:column}
#bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:3px solid var(--line)}
#back{font:inherit;font-weight:700;padding:6px 12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
#fr{flex:1;width:100%;border:0;background:var(--bg)}
</style><style id="polish">
:root{--bg:#f4f1ea;--panel:#ffffff;--ink:#14213d;--mute:#5b6478;--line:#ded7c6;--acc:#0f8b6d;--hot:#e4572e;--box:#f1ede2;--glow:rgba(15,139,109,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f1f;--panel:#121a33;--ink:#eaf0ff;--mute:#9aa6c7;--line:#25315a;--acc:#4ff0b0;--hot:#ff8a65;--box:#19244a;--glow:rgba(79,240,176,.16)}}
body{background:radial-gradient(900px 420px at 85% -10%,var(--glow),transparent 70%),var(--bg);letter-spacing:.1px}
main,#home{padding:18px 16px 28px}
h1{font-size:1.65rem;letter-spacing:-.2px;position:relative;padding-inline-start:14px}
h1::before{content:"";position:absolute;inset-inline-start:0;top:.28em;bottom:.28em;width:5px;border-radius:3px;background:linear-gradient(var(--acc),var(--hot))}
p.sub,.sub{font-size:.98rem;margin-bottom:14px}
canvas{border:2px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(10,15,40,.28),0 0 0 4px var(--glow)}
.hud{gap:10px;margin:12px 0}
.hud div{border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:0 2px 8px rgba(10,15,40,.08);border-top:3px solid var(--acc)}
.hud small{font-size:.8rem;letter-spacing:.2px}
.hud b{font-size:1.1rem;font-variant-numeric:tabular-nums;margin-top:2px}
.ctl{border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 2px 10px rgba(10,15,40,.07)}
.ctl label{margin-top:6px}
.ctl label span{background:var(--box);border-radius:8px;padding:0 10px;font-variant-numeric:tabular-nums;color:var(--acc);font-weight:800}
.ctl input[type=range]{height:28px;margin:2px 0 4px}
.tabs{gap:8px;margin:16px 0 10px}
.tabs button{border:1px solid var(--line);border-radius:12px;padding:10px 8px;box-shadow:0 2px 0 var(--line);transition:transform .12s,background .2s}
.tabs button:active{transform:translateY(2px);box-shadow:none}
.tabs button[aria-pressed="true"]{box-shadow:0 4px 14px var(--glow);background:linear-gradient(135deg,var(--acc),#13b58c);color:#04120d}
.card{border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 4px 18px rgba(10,15,40,.08)}
.card h2{font-size:1.2rem;margin-bottom:8px;color:var(--ink)}
.card p{margin:6px 0}
.eq{border-radius:10px;border:1px solid var(--line);border-inline-start:4px solid var(--acc);padding:10px 14px}
.why{border-inline-start:3px solid var(--line);padding-inline-start:10px}
.res{border-inline-start:0;border:1px solid var(--acc);border-radius:12px;background:linear-gradient(135deg,var(--glow),transparent);padding:10px 14px}
.note{line-height:1.7}
.tile{border:1px solid var(--line)!important;border-radius:18px;box-shadow:0 6px 18px rgba(10,15,40,.12)!important;transition:transform .15s,box-shadow .2s;padding:16px 10px}
.tile:hover{transform:translateY(-3px)}
.tile:active{transform:scale(.98)!important}
.tile svg{border-radius:14px;box-shadow:0 0 0 3px var(--glow)}
.tile .n{font-size:.85rem;background:var(--box);border-radius:999px;padding:0 12px}
#bar{border-bottom:1px solid var(--line)!important;box-shadow:0 2px 12px rgba(10,15,40,.12)}
#back{border-radius:10px!important}
.grid{gap:14px!important}
</style>
</head><body>
<div id="home"><h1>مختبر البصريات النظرية</h1><p class="sub">الفصل الأول • اضغط على أيقونة التجربة</p><div class="grid" id="grid"></div></div>
<div id="view"><div id="bar"><button id="back">← الرجوع</button><b id="ttl"></b></div><iframe id="fr" title="التجربة" sandbox="allow-scripts"></iframe></div>
<script>
const ITEMS=[{"n": "المسألة 1", "t": "مختبر الفوتونات", "d": "طاقة الفوتون وعددهم وزخمهم", "i": "bulb", "html": "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>مختبر الفوتونات – المسألة الأولى<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#f3efe4;--panel:#fffdf6;--ink:#1d2433;--mute:#5d6577;--line:#cfc8b4;--acc:#1f8a5b;--hot:#d6442f;--box:#e9e3d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0e1424;--panel:#161e35;--ink:#e8ecf7;--mute:#97a1bd;--line:#2c3860;--acc:#5ef0a8;--hot:#ff7a5c;--box:#1d2745}}\n*{box-sizing:border-box}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;line-height:1.7}\nmain{max-width:760px;margin:0 auto;padding:16px}\nh1{font-size:1.5rem;margin:8px 0 4px;font-weight:800}\np.sub{margin:0 0 12px;color:var(--mute)}\ncanvas{width:100%;display:block;image-rendering:pixelated;border:3px solid var(--line);background:#0b1020;touch-action:none;cursor:grab}\n.hud{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}\n.hud div{flex:1 1 140px;background:var(--panel);border:2px solid var(--line);padding:6px 10px}\n.hud b{display:block;font-size:1.05rem;direction:ltr;text-align:right}\n.hud small{color:var(--mute)}\n.ctl{background:var(--panel);border:2px solid var(--line);padding:10px 12px;margin:8px 0}\n.ctl label{display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:700}\n.ctl input{width:100%;accent-color:var(--acc)}\n.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}\n.tabs button{flex:1 1 70px;font:inherit;font-weight:700;padding:8px 6px;border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}\n.tabs button[aria-pressed=\"true\"]{background:var(--acc);color:#06130d;border-color:var(--acc)}\n.tabs button:focus-visible,input:focus-visible{outline:3px solid var(--hot);outline-offset:2px}\n.card{background:var(--panel);border:2px solid var(--line);border-top:0;padding:12px 14px}\n.card h2{font-size:1.1rem;margin:0 0 6px}\n.why{color:var(--mute);margin:4px 0 8px}\n.eq{background:var(--box);padding:8px 10px;margin:6px 0;direction:ltr;text-align:left;overflow-x:auto;font-family:\"Cambria Math\",Georgia,serif;font-size:1.05rem;white-space:nowrap}\n.res{border-inline-start:6px solid var(--acc);background:var(--box);padding:8px 12px;margin-top:10px;font-weight:700}\n.res span{direction:ltr;unicode-bidi:isolate}\n.note{font-size:.9rem;color:var(--mute)}\n<\/style>\n<style id=\"polish\">\n:root{--bg:#f4f1ea;--panel:#ffffff;--ink:#14213d;--mute:#5b6478;--line:#ded7c6;--acc:#0f8b6d;--hot:#e4572e;--box:#f1ede2;--glow:rgba(15,139,109,.18)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0a0f1f;--panel:#121a33;--ink:#eaf0ff;--mute:#9aa6c7;--line:#25315a;--acc:#4ff0b0;--hot:#ff8a65;--box:#19244a;--glow:rgba(79,240,176,.16)}}\nbody{background:radial-gradient(900px 420px at 85% -10%,var(--glow),transparent 70%),var(--bg);letter-spacing:.1px}\nmain,#home{padding:18px 16px 28px}\nh1{font-size:1.65rem;letter-spacing:-.2px;position:relative;padding-inline-start:14px}\nh1::before{content:\"\";position:absolute;inset-inline-start:0;top:.28em;bottom:.28em;width:5px;border-radius:3px;background:linear-gradient(var(--acc),var(--hot))}\np.sub,.sub{font-size:.98rem;margin-bottom:14px}\ncanvas{border:2px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(10,15,40,.28),0 0 0 4px var(--glow)}\n.hud{gap:10px;margin:12px 0}\n.hud div{border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:0 2px 8px rgba(10,15,40,.08);border-top:3px solid var(--acc)}\n.hud small{font-size:.8rem;letter-spacing:.2px}\n.hud b{font-size:1.1rem;font-variant-numeric:tabular-nums;margin-top:2px}\n.ctl{border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 2px 10px rgba(10,15,40,.07)}\n.ctl label{margin-top:6px}\n.ctl label span{background:var(--box);border-radius:8px;padding:0 10px;font-variant-numeric:tabular-nums;color:var(--acc);font-weight:800}\n.ctl input[type=range]{height:28px;margin:2px 0 4px}\n.tabs{gap:8px;margin:16px 0 10px}\n.tabs button{border:1px solid var(--line);border-radius:12px;padding:10px 8px;box-shadow:0 2px 0 var(--line);transition:transform .12s,background .2s}\n.tabs button:active{transform:translateY(2px);box-shadow:none}\n.tabs button[aria-pressed=\"true\"]{box-shadow:0 4px 14px var(--glow);background:linear-gradient(135deg,var(--acc),#13b58c);color:#04120d}\n.card{border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 4px 18px rgba(10,15,40,.08)}\n.card h2{font-size:1.2rem;margin-bottom:8px;color:var(--ink)}\n.card p{margin:6px 0}\n.eq{border-radius:10px;border:1px solid var(--line);border-inline-start:4px solid var(--acc);padding:10px 14px}\n.why{border-inline-start:3px solid var(--line);padding-inline-start:10px}\n.res{border-inline-start:0;border:1px solid var(--acc);border-radius:12px;background:linear-gradient(135deg,var(--glow),transparent);padding:10px 14px}\n.note{line-height:1.7}\n.tile{border:1px solid var(--line)!important;border-radius:18px;box-shadow:0 6px 18px rgba(10,15,40,.12)!important;transition:transform .15s,box-shadow .2s;padding:16px 10px}\n.tile:hover{transform:translateY(-3px)}\n.tile:active{transform:scale(.98)!important}\n.tile svg{border-radius:14px;box-shadow:0 0 0 3px var(--glow)}\n.tile .n{font-size:.85rem;background:var(--box);border-radius:999px;padding:0 12px}\n#bar{border-bottom:1px solid var(--line)!important;box-shadow:0 2px 12px rgba(10,15,40,.12)}\n#back{border-radius:10px!important}\n.grid{gap:14px!important}\n<\/style>\n<\/head>\n<body>\n<main>\n<h1>مختبر الفوتونات<\/h1>\n<p class=\"sub\">مصدر ضوئي أحادي اللون • اسحب المشهد بإصبعك لتدويره ثلاثي الأبعاد<\/p>\n\n<canvas id=\"cv\" width=\"360\" height=\"225\" aria-label=\"مشهد ثلاثي الأبعاد لفوتونات تنبعث من مصدر نحو جدار\"><\/canvas>\n\n<div class=\"hud\">\n<div><small>الزمن t<\/small><b id=\"hT\">0.00 s<\/b><\/div>\n<div><small>الفوتونات المنبعثة<\/small><b id=\"hN\">0<\/b><\/div>\n<div><small>الطاقة المصروفة<\/small><b id=\"hE\">0 J<\/b><\/div>\n<\/div>\n\n<div class=\"ctl\">\n<label>التردد f <span id=\"fv\"><\/span><\/label>\n<input id=\"fs\" type=\"range\" min=\"4\" max=\"8\" step=\"0.1\" value=\"6\" aria-label=\"التردد\">\n<label>القدرة P <span id=\"pv\"><\/span><\/label>\n<input id=\"ps\" type=\"range\" min=\"1\" max=\"20\" step=\"1\" value=\"10\" aria-label=\"القدرة\">\n<p class=\"note\" style=\"margin:6px 0 0\">كل مربع مضيء في المشهد = 10<sup>18<\/sup> فوتون (تجسيد مبسّط، فالفوتون الحقيقي أصغر بكثير). الثانية الواحدة تُعرض بحركة بطيئة.<\/p>\n<\/div>\n\n<div class=\"tabs\" role=\"group\" aria-label=\"خطوات الحل\">\n<button data-s=\"0\" aria-pressed=\"true\">1. الفوتون<\/button>\n<button data-s=\"1\" aria-pressed=\"false\">2. العدد (a)<\/button>\n<button data-s=\"2\" aria-pressed=\"false\">3. الزخم (b)<\/button>\n<button data-s=\"3\" aria-pressed=\"false\">4. الزخم الكلي<\/button>\n<\/div>\n<div class=\"card\" id=\"card\"><\/div>\n<\/main>\n\n<script>\nconst h=6.625e-34,c=3e8;\nconst cv=document.getElementById('cv'),g=cv.getContext('2d');\nconst W=cv.width,H=cv.height;\nconst RS=1.5;\nconst rgba=(c,a)=>{if(c[0]=='#'){const n=parseInt(c.slice(1,7),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}const m=c.match(/\\d+/g);return `rgba(${m[0]},${m[1]},${m[2]},${a})`};\nconst bg=()=>{const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#04061a');gr.addColorStop(.55,'#0c1535');gr.addColorStop(1,'#17234d');g.fillStyle=gr;g.fillRect(0,0,W,H);\n for(let i=0;i<90;i++){g.fillStyle=i%9?'rgba(170,195,255,.32)':'rgba(255,255,255,.85)';g.fillRect((i*97.3%W)|0,(i*53.7%(H*.55))|0,1,1)}\n const v=g.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,W*.68);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(2,3,18,.5)');g.fillStyle=v;g.fillRect(0,0,W,H)};\nconst glow=(x,y,z,r,c,a=.5)=>{const p=proj(x,y,z),R=Math.max(2,r*p.s*RS*.6);const gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,R);gr.addColorStop(0,rgba(c,a));gr.addColorStop(.4,rgba(c,a*.35));gr.addColorStop(1,rgba(c,0));g.globalCompositeOperation='lighter';g.fillStyle=gr;g.fillRect(p.x-R,p.y-R,2*R,2*R);g.globalCompositeOperation='source-over'};\nconst quad=(P,c,a)=>{g.fillStyle=rgba(c,a);g.beginPath();P.forEach((q,i)=>{const p=proj(q[0],q[1],q[2]);i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)});g.closePath();g.fill()};\nconst lab=(t,x,y,z,c,dy=-8)=>{const p=proj(x,y,z);g.font='bold '+Math.round(8*RS)+'px Tajawal,sans-serif';g.textAlign='center';const w=g.measureText(t).width,yy=p.y+dy*RS;g.fillStyle='rgba(4,6,26,.72)';g.fillRect(p.x-w/2-4,yy-10,w+8,14);g.fillStyle=c;g.fillText(t,p.x,yy+1)};\nconst shd=(cx,cz,rx,rz,y)=>{g.fillStyle='rgba(8,6,44,.6)';for(let i=-7;i<=7;i++)for(let j=-7;j<=7;j++){if(Math.abs(i+j)%2)continue;const a=i/7,b=j/7;if(a*a+b*b>1)continue;const p=proj(cx+a*rx,y,cz+b*rz);g.fillRect(p.x|0,p.y|0,2,2)}};\n\nlet f=6e14,P=10,step=0,yaw=-0.55,pit=0.28,t=0,last=performance.now(),push=0;\nconst sci=(x,d=3)=>{if(!x)return'0';const e=Math.floor(Math.log10(Math.abs(x)));return (x/10**e).toFixed(d-1)+' × 10<sup>'+e+'<\/sup>'};\nconst sciT=(x,d=3)=>{const e=Math.floor(Math.log10(Math.abs(x)));return (x/10**e).toFixed(d-1)+' × 10^'+e};\nconst calc=()=>{const E=h*f,N=P*1/E,p=E/c;return{E,N,p,pt:N*p,lam:c/f}};\nfunction rgb(l){// wavelength nm -> color\n let r=0,gg=0,b=0;\n if(l<440){r=(440-l)/60;b=1}else if(l<490){gg=(l-440)/50;b=1}else if(l<510){gg=1;b=(510-l)/20}else if(l<580){r=(l-510)/70;gg=1}else if(l<645){r=1;gg=(645-l)/65}else{r=1}\n return`rgb(${Math.round(255*Math.min(1,r*1.1))},${Math.round(255*Math.min(1,gg))},${Math.round(255*Math.min(1,b))})`}\nconst proj=(x,y,z)=>{\n let X=x*Math.cos(yaw)-z*Math.sin(yaw),Z=x*Math.sin(yaw)+z*Math.cos(yaw);\n let Y=y*Math.cos(pit)-Z*Math.sin(pit);Z=y*Math.sin(pit)+Z*Math.cos(pit);\n const s=3.2/(3.2+Z);return{x:W/2+X*s*93,y:H/2+21-Y*s*93,s}};\nconst px=(x,y,z,sz,col)=>{const p=proj(x,y,z);const q=Math.max(1,Math.round(sz*p.s*RS));const X=Math.round(p.x-q/2),Y=Math.round(p.y-q/2);g.fillStyle=col;g.fillRect(X,Y,q,q);if(q>=3){g.fillStyle=\"rgba(255,246,214,.42)\";g.fillRect(X,Y,q-1,1);g.fillRect(X,Y,1,q-1);g.fillStyle=\"rgba(22,10,70,.38)\";g.fillRect(X+1,Y+q-1,q-1,1);g.fillRect(X+q-1,Y+1,1,q-1)}};\nconst line=(a,b,col,n=24)=>{for(let i=0;i<=n;i++){const k=i/n;px(a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k,1,col)}};\nconst parts=[];let acc=0;\nconst RATE=()=>calc().N/1e18; // particles per second\nconst SLOW=6; // seconds real per 1 s sim\nfunction frame(now){\n const dt=Math.min(.05,(now-last)/1000);last=now;\n const k=calc(),col=rgb(k.lam*1e9);\n if(step>0){\n  t+=dt/SLOW;\n  if(t>=1){t=0;parts.length=0;acc=0;push=0}\n  acc+=dt/SLOW*RATE();\n  while(acc>=1){acc--;parts.push({x:-.82,y:(Math.random()-.5)*.5,z:(Math.random()-.5)*.5})}\n }else{t=(t+dt/10)%1}\n bg();\n // floor grid\n for(let i=-5;i<=5;i++){line([i*.2,-.5,-1],[i*.2,-.5,1],'#1c2a52',10);line([-1,-.5,i*.2],[1,-.5,i*.2],'#1c2a52',10)}\n // source lamp\n for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)for(let d=0;d<3;d++)px(-.95-d*.03,a*.1,b*.1,5,d==0?col:'#6b7596');\n px(-.95,0,0,9,col);\n // wall (pixel block) only in momentum steps\n if(step>=2){\n  const wx=.95+push*.05;\n  for(let a=-3;a<=3;a++)for(let b=-3;b<=3;b++)px(wx,a*.09,b*.09,7,(a+b)%2?'#7a4b3a':'#9a6350');\n }\n if(step==0){\n  // one big photon: wave packet traveling along x\n  const ph=now/260;\n  for(let i=0;i<60;i++){const x=-.8+i*.027,y=Math.sin(i*.55-ph)*.18;\n   px(x,y,0,6,col);px(x,0,Math.sin(i*.55-ph)*.18,2,'#ffffff55')}\n  px(-.8+((now/900)%1)*1.6,.3,0,5,'#fff');\n }else{\n  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=dt*1.9/SLOW*1.6;\n   if(p.x>.92){parts.splice(i,1);if(step>=2)push=Math.min(1,push+.03);continue}\n   px(p.x,p.y,p.z,7,col);px(p.x-.05,p.y,p.z,3,col)}\n }\n // HUD\n document.getElementById('hT').textContent=(step?t:0).toFixed(2)+' s';\n const n=step?k.N*t:0;\n document.getElementById('hN').innerHTML=step?sci(n,3):'0';\n document.getElementById('hE').textContent=(step?P*t:0).toFixed(1)+' J';\n\n shd(-.95,0,.15,.15,-.5);shd(.95,0,.1,.35,-.5);\n quad([[-1,-.15,-.15],[-1,.15,-.15],[-1,.15,.15],[-1,-.15,.15]],'#8a94b8',.35);\n glow(-.93,0,0,46,col,.6);\n lab('SOURCE',-.95,.3,0,'#cfe3ff');\n lab('f = '+(f/1e14).toFixed(1)+'×10¹⁴ Hz',-.95,-.3,0,col);\n if(step==0){glow(-.8+((now/900)%1)*1.6,.3,0,18,'#ffffff',.7);lab('E = hf',.1,.42,0,'#ffe9a8')}\n else{parts.forEach(p=>glow(p.x,p.y,p.z,12,col,.4));lab('1 square = 10¹⁸ photons',0,-.55,0,'#8fb0ff',6)}\n if(step>=2)lab('p = E/c',.95,.5,0,'#ffb4a0');\n requestAnimationFrame(frame)}\nrequestAnimationFrame(frame);\n\n// drag rotate\nlet dr=null;\ncv.addEventListener('pointerdown',e=>{dr=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)});\ncv.addEventListener('pointermove',e=>{if(!dr)return;yaw+=(e.clientX-dr[0])*.01;pit=Math.max(-.2,Math.min(1,pit+(e.clientY-dr[1])*.008));dr=[e.clientX,e.clientY]});\ncv.addEventListener('pointerup',()=>dr=null);\n\n// explanation cards\nfunction render(){\n const k=calc(),fs=f/1e14,ct=document.getElementById('card');\n document.getElementById('fv').innerHTML=fs.toFixed(1)+' × 10<sup>14<\/sup> Hz';\n document.getElementById('pv').textContent=P+' W';\n const S=[\n `<h2>الخطوة 1: طاقة الفوتون الواحد<\/h2>\n  <p>المصدر أحادي اللون، أي كل فوتوناته لها نفس التردد، فلكل فوتون نفس الطاقة. في المشهد تراه موجة واحدة تتقدم نحو الجدار. الطول الموجي هنا ≈ <span dir=\"ltr\">${(k.lam*1e9).toFixed(0)} nm<\/span> وهو ما يحدد لونه.<\/p>\n  <div class=\"eq\">E<sub>ph<\/sub> = h · f<\/div>\n  <p class=\"why\">السبب: طاقة الفوتون تتناسب طردياً مع التردد، وثابت بلانك h هو معامل التناسب.<\/p>\n  <div class=\"eq\">E<sub>ph<\/sub> = (6.625×10<sup>−34<\/sup>) × (${fs.toFixed(1)}×10<sup>14<\/sup>) = ${sci(k.E,4)} J<\/div>\n  <div class=\"res\">طاقة الفوتون = <span>${sci(k.E,4)} J<\/span><\/div>\n  <p class=\"note\">في الكتاب قُرّبت النتيجة إلى 3.97×10<sup>−19<\/sup> J عند f = 6×10<sup>14<\/sup>.<\/p>`,\n `<h2>الفرع (a): عدد الفوتونات في الثانية<\/h2>\n  <p>القدرة W تعني جول لكل ثانية، فالمصدر يصرف في ثانية واحدة طاقة قدرها <span dir=\"ltr\">${P} J<\/span>. اضغط 2 وراقب عداد الفوتونات وشريط الطاقة في الأعلى يصلان إلى القيمة الكلية عند t = 1 s.<\/p>\n  <div class=\"eq\">E<sub>total<\/sub> = P · t = ${P} W × 1 s = ${P} J<\/div>\n  <p class=\"why\">السبب: لتحويل القدرة إلى طاقة كلية خلال زمن محدد.<\/p>\n  <div class=\"eq\">N<sub>ph<\/sub> = E<sub>total<\/sub> / E<sub>ph<\/sub> = ${P} / ${sci(k.E,4)} ≈ ${sci(k.N,4)}<\/div>\n  <p class=\"why\">السبب: الطاقة الكلية مقسومة على طاقة الفوتون الواحد تعطي عدد الفوتونات.<\/p>\n  <div class=\"res\">N<sub>ph<\/sub> ≈ <span>${sci(k.N,4)}<\/span> فوتون<\/div>\n  <p class=\"note\">في الكتاب 2.515×10<sup>19<\/sup> بسبب تقريب E<sub>ph<\/sub> إلى 3.97×10<sup>−19<\/sup>.<\/p>`,\n `<h2>الفرع (b): زخم الفوتون الواحد<\/h2>\n  <p>الفوتون بلا كتلة سكون لكنه يحمل زخماً، لذلك يدفع الجدار دفعة صغيرة عند اصطدامه. شاهد الجدار يتحرك قليلاً مع وصول الفوتونات.<\/p>\n  <div class=\"eq\">p<sub>ph<\/sub> = E<sub>ph<\/sub> / c = ${sci(k.E,4)} / (3×10<sup>8<\/sup>)<\/div>\n  <p class=\"why\">السبب: الزخم يرتبط بالطاقة وسرعة الضوء c. ويمكن كتابتها أيضاً p = h/λ = hf/c.<\/p>\n  <div class=\"res\">p<sub>ph<\/sub> ≈ <span>${sci(k.p,4)}<\/span> N·s<\/div>\n  <p class=\"note\">وحدة N·s تساوي kg·m/s، وفي الكتاب كُتبت J·s/m وهي نفس الوحدة (1.32×10<sup>−27<\/sup>).<\/p>`,\n `<h2>الزخم الكلي للفوتونات المنبعثة في الثانية<\/h2>\n  <p>نضرب زخم الفوتون الواحد في عدد الفوتونات، أي مجموع الدفعات التي تلقاها الجدار خلال ثانية.<\/p>\n  <div class=\"eq\">p<sub>total<\/sub> = N<sub>ph<\/sub> · p<sub>ph<\/sub> = (${sci(k.N,4)}) × (${sci(k.p,4)})<\/div>\n  <p class=\"why\">السبب: كل فوتون يساهم بنفس الزخم، فالمجموع هو حاصل الضرب.<\/p>\n  <div class=\"res\">p<sub>total<\/sub> ≈ <span>${sci(k.pt,3)}<\/span> N·s (kg·m/s)<\/div>\n  <p class=\"note\">فحص سريع: p<sub>total<\/sub> = P·t / c = ${P} / (3×10<sup>8<\/sup>) = ${sci(P/c,3)}، وهي نفس القيمة. لاحظ أن الزخم الكلي لا يعتمد على التردد، جرّب تغيير f.<\/p>`];\n ct.innerHTML=S[step]}\ndocument.getElementById('fs').oninput=e=>{f=e.target.value*1e14;t=0;parts.length=0;acc=0;push=0;render()};\ndocument.getElementById('ps').oninput=e=>{P=+e.target.value;t=0;parts.length=0;acc=0;push=0;render()};\ndocument.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{\n step=+b.dataset.s;t=0;parts.length=0;acc=0;push=0;\n document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',x==b));render()});\nrender();\n<\/script>\n<\/body>\n<\/html>\n"}, {"n": "المسألة 2", "t": "المنشور الزجاجي", "d": "الطول الموجي وعدد الأطوال في الزجاج", "i": "prism", "html": "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>مختبر المنشور الزجاجي – المسألة الثانية<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#f3efe4;--panel:#fffdf6;--ink:#1d2433;--mute:#5d6577;--line:#cfc8b4;--acc:#1f8a5b;--hot:#d6442f;--box:#e9e3d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0e1424;--panel:#161e35;--ink:#e8ecf7;--mute:#97a1bd;--line:#2c3860;--acc:#5ef0a8;--hot:#ff7a5c;--box:#1d2745}}\n*{box-sizing:border-box}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;line-height:1.7}\nmain{max-width:760px;margin:0 auto;padding:16px}\nh1{font-size:1.5rem;margin:8px 0 4px;font-weight:800}\np.sub{margin:0 0 12px;color:var(--mute)}\ncanvas{width:100%;display:block;image-rendering:pixelated;border:3px solid var(--line);background:#0b1020;touch-action:none;cursor:grab}\n.hud{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}\n.hud div{flex:1 1 140px;background:var(--panel);border:2px solid var(--line);padding:6px 10px}\n.hud b{display:block;font-size:1rem;direction:ltr;text-align:right}\n.hud small{color:var(--mute)}\n.ctl{background:var(--panel);border:2px solid var(--line);padding:10px 12px;margin:8px 0}\n.ctl label{display:flex;justify-content:space-between;gap:10px;font-weight:700}\n.ctl input{width:100%;accent-color:var(--acc)}\n.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}\n.tabs button{flex:1 1 90px;font:inherit;font-weight:700;padding:8px 6px;border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}\n.tabs button[aria-pressed=\"true\"]{background:var(--acc);color:#06130d;border-color:var(--acc)}\n.tabs button:focus-visible,input:focus-visible{outline:3px solid var(--hot);outline-offset:2px}\n.card{background:var(--panel);border:2px solid var(--line);border-top:0;padding:12px 14px}\n.card h2{font-size:1.1rem;margin:0 0 6px}\n.why{color:var(--mute);margin:4px 0 8px}\n.eq{background:var(--box);padding:8px 10px;margin:6px 0;direction:ltr;text-align:left;overflow-x:auto;font-family:\"Cambria Math\",Georgia,serif;font-size:1.05rem;white-space:nowrap}\n.res{border-inline-start:6px solid var(--acc);background:var(--box);padding:8px 12px;margin-top:10px;font-weight:700}\n.res span{direction:ltr;unicode-bidi:isolate}\n.note{font-size:.9rem;color:var(--mute)}\n<\/style>\n<style id=\"polish\">\n:root{--bg:#f4f1ea;--panel:#ffffff;--ink:#14213d;--mute:#5b6478;--line:#ded7c6;--acc:#0f8b6d;--hot:#e4572e;--box:#f1ede2;--glow:rgba(15,139,109,.18)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0a0f1f;--panel:#121a33;--ink:#eaf0ff;--mute:#9aa6c7;--line:#25315a;--acc:#4ff0b0;--hot:#ff8a65;--box:#19244a;--glow:rgba(79,240,176,.16)}}\nbody{background:radial-gradient(900px 420px at 85% -10%,var(--glow),transparent 70%),var(--bg);letter-spacing:.1px}\nmain,#home{padding:18px 16px 28px}\nh1{font-size:1.65rem;letter-spacing:-.2px;position:relative;padding-inline-start:14px}\nh1::before{content:\"\";position:absolute;inset-inline-start:0;top:.28em;bottom:.28em;width:5px;border-radius:3px;background:linear-gradient(var(--acc),var(--hot))}\np.sub,.sub{font-size:.98rem;margin-bottom:14px}\ncanvas{border:2px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(10,15,40,.28),0 0 0 4px var(--glow)}\n.hud{gap:10px;margin:12px 0}\n.hud div{border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:0 2px 8px rgba(10,15,40,.08);border-top:3px solid var(--acc)}\n.hud small{font-size:.8rem;letter-spacing:.2px}\n.hud b{font-size:1.1rem;font-variant-numeric:tabular-nums;margin-top:2px}\n.ctl{border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 2px 10px rgba(10,15,40,.07)}\n.ctl label{margin-top:6px}\n.ctl label span{background:var(--box);border-radius:8px;padding:0 10px;font-variant-numeric:tabular-nums;color:var(--acc);font-weight:800}\n.ctl input[type=range]{height:28px;margin:2px 0 4px}\n.tabs{gap:8px;margin:16px 0 10px}\n.tabs button{border:1px solid var(--line);border-radius:12px;padding:10px 8px;box-shadow:0 2px 0 var(--line);transition:transform .12s,background .2s}\n.tabs button:active{transform:translateY(2px);box-shadow:none}\n.tabs button[aria-pressed=\"true\"]{box-shadow:0 4px 14px var(--glow);background:linear-gradient(135deg,var(--acc),#13b58c);color:#04120d}\n.card{border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 4px 18px rgba(10,15,40,.08)}\n.card h2{font-size:1.2rem;margin-bottom:8px;color:var(--ink)}\n.card p{margin:6px 0}\n.eq{border-radius:10px;border:1px solid var(--line);border-inline-start:4px solid var(--acc);padding:10px 14px}\n.why{border-inline-start:3px solid var(--line);padding-inline-start:10px}\n.res{border-inline-start:0;border:1px solid var(--acc);border-radius:12px;background:linear-gradient(135deg,var(--glow),transparent);padding:10px 14px}\n.note{line-height:1.7}\n.tile{border:1px solid var(--line)!important;border-radius:18px;box-shadow:0 6px 18px rgba(10,15,40,.12)!important;transition:transform .15s,box-shadow .2s;padding:16px 10px}\n.tile:hover{transform:translateY(-3px)}\n.tile:active{transform:scale(.98)!important}\n.tile svg{border-radius:14px;box-shadow:0 0 0 3px var(--glow)}\n.tile .n{font-size:.85rem;background:var(--box);border-radius:999px;padding:0 12px}\n#bar{border-bottom:1px solid var(--line)!important;box-shadow:0 2px 12px rgba(10,15,40,.12)}\n#back{border-radius:10px!important}\n.grid{gap:14px!important}\n<\/style>\n<\/head>\n<body>\n<main>\n<h1>مختبر المنشور الزجاجي<\/h1>\n<p class=\"sub\">ضوء أبيض يدخل زجاجاً فينقسم إلى أحمر وأزرق • اسحب المشهد لتدويره<\/p>\n\n<canvas id=\"cv\" width=\"360\" height=\"225\" aria-label=\"مشهد ثلاثي الأبعاد لموجتين حمراء وزرقاء داخل كتلة زجاجية\"><\/canvas>\n\n<div class=\"hud\">\n<div><small>أطوار الأحمر N<sub>R<\/sub> حتى الآن<\/small><b id=\"hR\">0<\/b><\/div>\n<div><small>أطوار الأزرق N<sub>B<\/sub> حتى الآن<\/small><b id=\"hB\">0<\/b><\/div>\n<div><small>الفرق ΔN<\/small><b id=\"hD\">0<\/b><\/div>\n<\/div>\n\n<div class=\"ctl\">\n<label>n<sub>R<\/sub> (الأحمر) <span id=\"v1\"><\/span><\/label>\n<input id=\"s1\" type=\"range\" min=\"1.3\" max=\"1.7\" step=\"0.01\" value=\"1.51\" aria-label=\"معامل انكسار الأحمر\">\n<label>n<sub>B<\/sub> (الأزرق) <span id=\"v2\"><\/span><\/label>\n<input id=\"s2\" type=\"range\" min=\"1.3\" max=\"1.7\" step=\"0.01\" value=\"1.53\" aria-label=\"معامل انكسار الأزرق\">\n<label>المسار d <span id=\"v3\"><\/span><\/label>\n<input id=\"s3\" type=\"range\" min=\"1\" max=\"20\" step=\"1\" value=\"10\" aria-label=\"طول المسار بالسنتيمتر\">\n<p class=\"note\" style=\"margin:6px 0 0\">الرسم مقياس مبسّط: الكتلة تعرض نحو 8 أطوال موجية للأحمر، أما العدد الحقيقي في 10 cm فمئات الآلاف. المربع الأبيض يمسح المسار ويعدّ الأطوار.<\/p>\n<\/div>\n\n<div class=\"tabs\" role=\"group\" aria-label=\"خطوات الحل\">\n<button data-s=\"0\" aria-pressed=\"true\">1. الفرع (a)<\/button>\n<button data-s=\"1\" aria-pressed=\"false\">2. عدّ الأطوال<\/button>\n<button data-s=\"2\" aria-pressed=\"false\">3. الفرق ΔN<\/button>\n<\/div>\n<div class=\"card\" id=\"card\"><\/div>\n<\/main>\n\n<script>\nconst cv=document.getElementById('cv'),g=cv.getContext('2d');\nconst W=cv.width,H=cv.height;\nconst RS=1.5;\nconst rgba=(c,a)=>{if(c[0]=='#'){const n=parseInt(c.slice(1,7),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}const m=c.match(/\\d+/g);return `rgba(${m[0]},${m[1]},${m[2]},${a})`};\nconst bg=()=>{const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#04061a');gr.addColorStop(.55,'#0c1535');gr.addColorStop(1,'#17234d');g.fillStyle=gr;g.fillRect(0,0,W,H);\n for(let i=0;i<90;i++){g.fillStyle=i%9?'rgba(170,195,255,.32)':'rgba(255,255,255,.85)';g.fillRect((i*97.3%W)|0,(i*53.7%(H*.55))|0,1,1)}\n const v=g.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,W*.68);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(2,3,18,.5)');g.fillStyle=v;g.fillRect(0,0,W,H)};\nconst glow=(x,y,z,r,c,a=.5)=>{const p=proj(x,y,z),R=Math.max(2,r*p.s*RS*.6);const gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,R);gr.addColorStop(0,rgba(c,a));gr.addColorStop(.4,rgba(c,a*.35));gr.addColorStop(1,rgba(c,0));g.globalCompositeOperation='lighter';g.fillStyle=gr;g.fillRect(p.x-R,p.y-R,2*R,2*R);g.globalCompositeOperation='source-over'};\nconst quad=(P,c,a)=>{g.fillStyle=rgba(c,a);g.beginPath();P.forEach((q,i)=>{const p=proj(q[0],q[1],q[2]);i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)});g.closePath();g.fill()};\nconst lab=(t,x,y,z,c,dy=-8)=>{const p=proj(x,y,z);g.font='bold '+Math.round(8*RS)+'px Tajawal,sans-serif';g.textAlign='center';const w=g.measureText(t).width,yy=p.y+dy*RS;g.fillStyle='rgba(4,6,26,.72)';g.fillRect(p.x-w/2-4,yy-10,w+8,14);g.fillStyle=c;g.fillText(t,p.x,yy+1)};\nconst shd=(cx,cz,rx,rz,y)=>{g.fillStyle='rgba(8,6,44,.6)';for(let i=-7;i<=7;i++)for(let j=-7;j<=7;j++){if(Math.abs(i+j)%2)continue;const a=i/7,b=j/7;if(a*a+b*b>1)continue;const p=proj(cx+a*rx,y,cz+b*rz);g.fillRect(p.x|0,p.y|0,2,2)}};\n\nlet nR=1.51,nB=1.53,dcm=10,step=0,yaw=-0.5,pit=0.3,m=0;\nconst L0R=700,L0B=400,K=1/(8*(700/1.51)); // visual units per nm\nconst sci=(x,d=3)=>{if(!x)return'0';const e=Math.floor(Math.log10(Math.abs(x)));return (x/10**e).toFixed(d-1)+' × 10<sup>'+e+'<\/sup>'};\nconst calc=()=>{const d=dcm/100,lR=L0R/nR,lB=L0B/nB,NR=d*nR/(L0R*1e-9),NB=d*nB/(L0B*1e-9);return{d,lR,lB,NR,NB,dN:NB-NR}};\nconst proj=(x,y,z)=>{\n let X=x*Math.cos(yaw)-z*Math.sin(yaw),Z=x*Math.sin(yaw)+z*Math.cos(yaw);\n let Y=y*Math.cos(pit)-Z*Math.sin(pit);Z=y*Math.sin(pit)+Z*Math.cos(pit);\n const s=3.2/(3.2+Z);return{x:W/2+X*s*87,y:H/2+18-Y*s*87,s}};\nconst px=(x,y,z,sz,col)=>{const p=proj(x,y,z);const q=Math.max(1,Math.round(sz*p.s*RS));const X=Math.round(p.x-q/2),Y=Math.round(p.y-q/2);g.fillStyle=col;g.fillRect(X,Y,q,q);if(q>=3){g.fillStyle=\"rgba(255,246,214,.42)\";g.fillRect(X,Y,q-1,1);g.fillRect(X,Y,1,q-1);g.fillStyle=\"rgba(22,10,70,.38)\";g.fillRect(X+1,Y+q-1,q-1,1);g.fillRect(X+q-1,Y+1,1,q-1)}};\nconst line=(a,b,col,n=24)=>{for(let i=0;i<=n;i++){const k=i/n;px(a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k,1,col)}};\nconst RED='#ff4d4d',BLU='#4da6ff';\n// phase: air before block, then glass inside block (x in [-.5,.5]), then air after\nconst ph=(x,l0,n)=>{const la=l0*K,lg=la/n;if(x<-.5)return(x+1)/la;const a=.5/la;if(x<=.5)return a+(x+.5)/lg;return a+1/lg+(x-.5)/la};\nfunction frame(now){\n const k=calc();\n m=(m+ (step?0.0025:0))%1.1;\n bg();\n for(let i=-5;i<=5;i++){line([i*.2,-.55,-1],[i*.2,-.55,1],'#1c2a52',10);line([-1,-.55,i*.2],[1,-.55,i*.2],'#1c2a52',10)}\n // glass block edges + fill streaks\n const C=[[-.5,-.4,-.3],[.5,-.4,-.3],[.5,.4,-.3],[-.5,.4,-.3],[-.5,-.4,.3],[.5,-.4,.3],[.5,.4,.3],[-.5,.4,.3]];\n [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(e=>line(C[e[0]],C[e[1]],'#6fd0e8',20));\n for(let i=0;i<14;i++)for(let j=0;j<6;j++)if((i+j)%3==0)px(-.5+i*.077,.4,-.3+j*.12,1,'#2f6f86');\n // source white beam\n for(let i=0;i<10;i++)px(-1.05+i*.01,0,0,5,'#ffffff');\n const t=now/260;\n const lane=(yo,l0,n,col,dim)=>{\n  for(let x=-.95;x<=.95;x+=.012){\n   const y=yo+Math.sin(2*Math.PI*ph(x,l0,n)-t)*.1;\n   px(x,y,0,dim?2:3,dim?col+'55':col)}};\n const showR=true,showB=step!=0;\n lane(.2,L0R,nR,RED,false);\n lane(-.2,L0B,nB,BLU,!showB);\n // sweep marker\n if(step>0&&m<=1){const x=-.5+m;\n  for(let y=-.38;y<=.38;y+=.04)px(x,y,0,3,'#ffffff');\n  if(step==2){const xr=-.5+m;for(let i=0;i<8;i++)px(xr,-.38+i*.01,.2,2,'#ffe066')}}\n // HUD\n const f=Math.min(1,m);\n document.getElementById('hR').innerHTML=step?sci(k.NR*f,3):'0';\n document.getElementById('hB').innerHTML=step?sci(k.NB*f,3):'0';\n document.getElementById('hD').innerHTML=step?sci(k.dN*f,3):'0';\n\n shd(0,0,.55,.35,-.55);\n quad([[-.5,-.4,.3],[.5,-.4,.3],[.5,.4,.3],[-.5,.4,.3]],'#6fd0e8',.12);\n quad([[-.5,.4,-.3],[.5,.4,-.3],[.5,.4,.3],[-.5,.4,.3]],'#c9f3ff',.18);\n quad([[.5,-.4,-.3],[.5,-.4,.3],[.5,.4,.3],[.5,.4,-.3]],'#4aa8c8',.14);\n glow(-1.0,0,0,40,'#ffffff',.65);\n lab('WHITE',-.95,.28,0,'#fff');\n lab('GLASS',0,.62,0,'#9fe8ff');\n lab('λR = λ0/nR = '+k.lR.toFixed(1)+' nm',0,.5,0,'#ff8a8a',-4);\n lab('λB = '+k.lB.toFixed(1)+' nm',0,-.5,0,'#7ec4ff',10);\n lab('λ0R = 700',-.72,.42,0,'#ff8a8a');lab('λ0B = 400',-.72,-.42,0,'#7ec4ff');\n if(step>0&&m<=1)glow(-.5+m,0,0,20,'#fff',.55);\n requestAnimationFrame(frame)}\nrequestAnimationFrame(frame);\n\nlet dr=null;\ncv.addEventListener('pointerdown',e=>{dr=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)});\ncv.addEventListener('pointermove',e=>{if(!dr)return;yaw+=(e.clientX-dr[0])*.01;pit=Math.max(-.2,Math.min(1,pit+(e.clientY-dr[1])*.008));dr=[e.clientX,e.clientY]});\ncv.addEventListener('pointerup',()=>dr=null);\n\nfunction render(){\n const k=calc(),ct=document.getElementById('card'),cm=dcm;\n document.getElementById('v1').textContent=nR.toFixed(2);\n document.getElementById('v2').textContent=nB.toFixed(2);\n document.getElementById('v3').textContent=cm+' cm';\n const S=[\n `<h2>الفرع (a): الطول الموجي للأحمر داخل الزجاج<\/h2>\n  <p>راقب الموجة الحمراء: خارج الكتلة موجتها طويلة، وحال دخولها الزجاج تتضاغط وتقصر. التردد ثابت، لكن السرعة تقل فيقصر الطول الموجي.<\/p>\n  <div class=\"eq\">λ = λ<sub>0<\/sub> / n<\/div>\n  <p class=\"why\">السبب: تردد الضوء يبقى ثابتاً عند انتقاله بين الأوساط، بينما تتغير سرعته وطوله الموجي تبعاً لمعامل انكسار الوسط n.<\/p>\n  <div class=\"eq\">λ<sub>R<\/sub> = λ<sub>0R<\/sub> / n<sub>R<\/sub> = 700 nm / ${nR.toFixed(2)} ≈ ${k.lR.toFixed(1)} nm<\/div>\n  <div class=\"res\">λ<sub>R<\/sub> ≈ <span>${k.lR.toFixed(1)} nm<\/span><\/div>\n  <p class=\"note\">لاحظ أن الطول الموجي داخل الزجاج أقل من 700 nm لأن n أكبر من 1. بقيمة n<sub>R<\/sub> = 1.51 تطلع 463.6 nm كما في الكتاب.<\/p>`,\n `<h2>الفرع (b): عدد الأطوال الموجية في المسار<\/h2>\n  <p>اضغط على التبويب ودع المربع الأبيض يمسح الكتلة: يعدّ عدد الموجات الكاملة التي تتسع داخل المسار d لكل لون. الأزرق أقصر طولاً موجياً داخل الزجاج فيتسع له عدد أكبر.<\/p>\n  <div class=\"eq\">N = d / λ = d · n / λ<sub>0<\/sub><\/div>\n  <p class=\"why\">السبب: لحساب عدد الموجات الكاملة التي تتسع لها مسافة d داخل الوسط.<\/p>\n  <div class=\"eq\">d = ${cm} cm = ${(k.d).toFixed(2)} m &nbsp;،&nbsp; λ<sub>0B<\/sub> = 400×10<sup>−9<\/sup> m<\/div>\n  <div class=\"eq\">N<sub>R<\/sub> = ${k.d.toFixed(2)} × ${nR.toFixed(2)} / (700×10<sup>−9<\/sup>) = ${sci(k.NR,4)}<\/div>\n  <div class=\"eq\">N<sub>B<\/sub> = ${k.d.toFixed(2)} × ${nB.toFixed(2)} / (400×10<sup>−9<\/sup>) = ${sci(k.NB,4)}<\/div>\n  <div class=\"res\">N<sub>R<\/sub> ≈ <span>${sci(k.NR,4)}<\/span> ، N<sub>B<\/sub> ≈ <span>${sci(k.NB,4)}<\/span><\/div>`,\n `<h2>الفرق في عدد الأطوال الموجية ΔN<\/h2>\n  <p>الفرق هو الأطوار الزائدة التي يملكها الأزرق مقارنة بالأحمر على نفس المسار.<\/p>\n  <div class=\"eq\">ΔN = N<sub>B<\/sub> − N<sub>R<\/sub> = d ( n<sub>B<\/sub>/λ<sub>0B<\/sub> − n<sub>R<\/sub>/λ<sub>0R<\/sub> )<\/div>\n  <p class=\"why\">السبب: لإيجاد الفارق بين عدد موجات الأزرق وعدد موجات الأحمر، والأزرق عدد موجاته أكبر لأن طوله الموجي أقصر ومعامل انكساره أكبر.<\/p>\n  <div class=\"eq\">ΔN = ${k.d.toFixed(2)} × ( ${(nB/(L0B*1e-9)/1e6).toFixed(3)}×10<sup>6<\/sup> − ${(nR/(L0R*1e-9)/1e6).toFixed(3)}×10<sup>6<\/sup> )<\/div>\n  <div class=\"res\">ΔN ≈ <span>${sci(k.dN,3)}<\/span> طور<\/div>\n  <p class=\"note\">عند القيم الأصلية تطلع 1.67×10<sup>5<\/sup>. في الكتاب 1.64×10<sup>5<\/sup>، وهو فرق تقريب أو خطأ طباعي في الطرح بحسب الملف التوضيحي.<\/p>`];\n ct.innerHTML=S[step]}\nconst upd=()=>{m=0;render()};\ndocument.getElementById('s1').oninput=e=>{nR=+e.target.value;upd()};\ndocument.getElementById('s2').oninput=e=>{nB=+e.target.value;upd()};\ndocument.getElementById('s3').oninput=e=>{dcm=+e.target.value;upd()};\ndocument.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{\n step=+b.dataset.s;m=0;\n document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',x==b));render()});\nrender();\n<\/script>\n<\/body>\n<\/html>\n"}, {"n": "المسألة 3", "t": "سباق الضوء في اللوح", "d": "سرعة الضوء وزمن العبور", "i": "slab", "html": "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>سباق الضوء في اللوح الزجاجي – المسألة الثالثة<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#f3efe4;--panel:#fffdf6;--ink:#1d2433;--mute:#5d6577;--line:#cfc8b4;--acc:#1f8a5b;--hot:#d6442f;--box:#e9e3d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0e1424;--panel:#161e35;--ink:#e8ecf7;--mute:#97a1bd;--line:#2c3860;--acc:#5ef0a8;--hot:#ff7a5c;--box:#1d2745}}\n*{box-sizing:border-box}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;line-height:1.7}\nmain{max-width:760px;margin:0 auto;padding:16px}\nh1{font-size:1.5rem;margin:8px 0 4px;font-weight:800}\np.sub{margin:0 0 12px;color:var(--mute)}\ncanvas{width:100%;display:block;image-rendering:pixelated;border:3px solid var(--line);background:#0b1020;touch-action:none;cursor:grab}\n.hud{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}\n.hud div{flex:1 1 140px;background:var(--panel);border:2px solid var(--line);padding:6px 10px}\n.hud b{display:block;font-size:1rem;direction:ltr;text-align:right}\n.hud small{color:var(--mute)}\n.ctl{background:var(--panel);border:2px solid var(--line);padding:10px 12px;margin:8px 0}\n.ctl label{display:flex;justify-content:space-between;gap:10px;font-weight:700}\n.ctl input{width:100%;accent-color:var(--acc)}\n.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}\n.tabs button{flex:1 1 70px;font:inherit;font-weight:700;padding:8px 6px;border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}\n.tabs button[aria-pressed=\"true\"]{background:var(--acc);color:#06130d;border-color:var(--acc)}\n.tabs button:focus-visible,input:focus-visible{outline:3px solid var(--hot);outline-offset:2px}\n.card{background:var(--panel);border:2px solid var(--line);border-top:0;padding:12px 14px}\n.card h2{font-size:1.1rem;margin:0 0 6px}\n.why{color:var(--mute);margin:4px 0 8px}\n.eq{background:var(--box);padding:8px 10px;margin:6px 0;direction:ltr;text-align:left;overflow-x:auto;font-family:\"Cambria Math\",Georgia,serif;font-size:1.05rem;white-space:nowrap}\n.res{border-inline-start:6px solid var(--acc);background:var(--box);padding:8px 12px;margin-top:10px;font-weight:700}\n.res span{direction:ltr;unicode-bidi:isolate}\n.note{font-size:.9rem;color:var(--mute)}\n<\/style>\n<style id=\"polish\">\n:root{--bg:#f4f1ea;--panel:#ffffff;--ink:#14213d;--mute:#5b6478;--line:#ded7c6;--acc:#0f8b6d;--hot:#e4572e;--box:#f1ede2;--glow:rgba(15,139,109,.18)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0a0f1f;--panel:#121a33;--ink:#eaf0ff;--mute:#9aa6c7;--line:#25315a;--acc:#4ff0b0;--hot:#ff8a65;--box:#19244a;--glow:rgba(79,240,176,.16)}}\nbody{background:radial-gradient(900px 420px at 85% -10%,var(--glow),transparent 70%),var(--bg);letter-spacing:.1px}\nmain,#home{padding:18px 16px 28px}\nh1{font-size:1.65rem;letter-spacing:-.2px;position:relative;padding-inline-start:14px}\nh1::before{content:\"\";position:absolute;inset-inline-start:0;top:.28em;bottom:.28em;width:5px;border-radius:3px;background:linear-gradient(var(--acc),var(--hot))}\np.sub,.sub{font-size:.98rem;margin-bottom:14px}\ncanvas{border:2px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(10,15,40,.28),0 0 0 4px var(--glow)}\n.hud{gap:10px;margin:12px 0}\n.hud div{border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:0 2px 8px rgba(10,15,40,.08);border-top:3px solid var(--acc)}\n.hud small{font-size:.8rem;letter-spacing:.2px}\n.hud b{font-size:1.1rem;font-variant-numeric:tabular-nums;margin-top:2px}\n.ctl{border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 2px 10px rgba(10,15,40,.07)}\n.ctl label{margin-top:6px}\n.ctl label span{background:var(--box);border-radius:8px;padding:0 10px;font-variant-numeric:tabular-nums;color:var(--acc);font-weight:800}\n.ctl input[type=range]{height:28px;margin:2px 0 4px}\n.tabs{gap:8px;margin:16px 0 10px}\n.tabs button{border:1px solid var(--line);border-radius:12px;padding:10px 8px;box-shadow:0 2px 0 var(--line);transition:transform .12s,background .2s}\n.tabs button:active{transform:translateY(2px);box-shadow:none}\n.tabs button[aria-pressed=\"true\"]{box-shadow:0 4px 14px var(--glow);background:linear-gradient(135deg,var(--acc),#13b58c);color:#04120d}\n.card{border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 4px 18px rgba(10,15,40,.08)}\n.card h2{font-size:1.2rem;margin-bottom:8px;color:var(--ink)}\n.card p{margin:6px 0}\n.eq{border-radius:10px;border:1px solid var(--line);border-inline-start:4px solid var(--acc);padding:10px 14px}\n.why{border-inline-start:3px solid var(--line);padding-inline-start:10px}\n.res{border-inline-start:0;border:1px solid var(--acc);border-radius:12px;background:linear-gradient(135deg,var(--glow),transparent);padding:10px 14px}\n.note{line-height:1.7}\n.tile{border:1px solid var(--line)!important;border-radius:18px;box-shadow:0 6px 18px rgba(10,15,40,.12)!important;transition:transform .15s,box-shadow .2s;padding:16px 10px}\n.tile:hover{transform:translateY(-3px)}\n.tile:active{transform:scale(.98)!important}\n.tile svg{border-radius:14px;box-shadow:0 0 0 3px var(--glow)}\n.tile .n{font-size:.85rem;background:var(--box);border-radius:999px;padding:0 12px}\n#bar{border-bottom:1px solid var(--line)!important;box-shadow:0 2px 12px rgba(10,15,40,.12)}\n#back{border-radius:10px!important}\n.grid{gap:14px!important}\n<\/style>\n<\/head>\n<body>\n<main>\n<h1>سباق الضوء في اللوح الزجاجي<\/h1>\n<p class=\"sub\">نبضة ضوء تعبر لوحاً بزاوية 30° • اسحب المشهد لتدويره<\/p>\n\n<canvas id=\"cv\" width=\"360\" height=\"225\" aria-label=\"مشهد ثلاثي الأبعاد لنبضة ضوء تعبر لوحاً زجاجياً\"><\/canvas>\n\n<div class=\"hud\">\n<div><small>السرعة في اللوح v<\/small><b id=\"hV\"><\/b><\/div>\n<div><small>طول المسار r<\/small><b id=\"hR\"><\/b><\/div>\n<div><small>الزمن المنقضي<\/small><b id=\"hT\">0<\/b><\/div>\n<\/div>\n\n<div class=\"ctl\">\n<label>معامل الانكسار n<sub>1<\/sub> <span id=\"v1\"><\/span><\/label>\n<input id=\"s1\" type=\"range\" min=\"1\" max=\"2\" step=\"0.05\" value=\"1.5\" aria-label=\"معامل الانكسار\">\n<label>السمك <span id=\"v2\"><\/span><\/label>\n<input id=\"s2\" type=\"range\" min=\"1\" max=\"10\" step=\"0.5\" value=\"5\" aria-label=\"السمك بالسنتيمتر\">\n<label>الزاوية θ <span id=\"v3\"><\/span><\/label>\n<input id=\"s3\" type=\"range\" min=\"0\" max=\"45\" step=\"1\" value=\"30\" aria-label=\"الزاوية\">\n<label>نسبة الزمن t<sub>2<\/sub>/t<sub>1<\/sub> <span id=\"v4\"><\/span><\/label>\n<input id=\"s4\" type=\"range\" min=\"1.5\" max=\"4\" step=\"0.5\" value=\"2\" aria-label=\"نسبة الزمن\">\n<p class=\"note\" style=\"margin:6px 0 0\">الرسم مبسّط: سمك اللوح في المشهد ثابت، والمهم أن ترى أن الضوء في المادة المجهولة يتأخر عن الضوء في اللوح الأول.<\/p>\n<\/div>\n\n<div class=\"tabs\" role=\"group\" aria-label=\"خطوات الحل\">\n<button data-s=\"0\" aria-pressed=\"true\">1. السرعة<\/button>\n<button data-s=\"1\" aria-pressed=\"false\">2. المسار<\/button>\n<button data-s=\"2\" aria-pressed=\"false\">3. الزمن (a)<\/button>\n<button data-s=\"3\" aria-pressed=\"false\">4. المجهولة (b)<\/button>\n<\/div>\n<div class=\"card\" id=\"card\"><\/div>\n<\/main>\n\n<script>\nconst C=3e8;\nconst cv=document.getElementById('cv'),g=cv.getContext('2d');\nconst W=cv.width,H=cv.height;\nconst RS=1.5;\nconst rgba=(c,a)=>{if(c[0]=='#'){const n=parseInt(c.slice(1,7),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}const m=c.match(/\\d+/g);return `rgba(${m[0]},${m[1]},${m[2]},${a})`};\nconst bg=()=>{const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#04061a');gr.addColorStop(.55,'#0c1535');gr.addColorStop(1,'#17234d');g.fillStyle=gr;g.fillRect(0,0,W,H);\n for(let i=0;i<90;i++){g.fillStyle=i%9?'rgba(170,195,255,.32)':'rgba(255,255,255,.85)';g.fillRect((i*97.3%W)|0,(i*53.7%(H*.55))|0,1,1)}\n const v=g.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,W*.68);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(2,3,18,.5)');g.fillStyle=v;g.fillRect(0,0,W,H)};\nconst glow=(x,y,z,r,c,a=.5)=>{const p=proj(x,y,z),R=Math.max(2,r*p.s*RS*.6);const gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,R);gr.addColorStop(0,rgba(c,a));gr.addColorStop(.4,rgba(c,a*.35));gr.addColorStop(1,rgba(c,0));g.globalCompositeOperation='lighter';g.fillStyle=gr;g.fillRect(p.x-R,p.y-R,2*R,2*R);g.globalCompositeOperation='source-over'};\nconst quad=(P,c,a)=>{g.fillStyle=rgba(c,a);g.beginPath();P.forEach((q,i)=>{const p=proj(q[0],q[1],q[2]);i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)});g.closePath();g.fill()};\nconst lab=(t,x,y,z,c,dy=-8)=>{const p=proj(x,y,z);g.font='bold '+Math.round(8*RS)+'px Tajawal,sans-serif';g.textAlign='center';const w=g.measureText(t).width,yy=p.y+dy*RS;g.fillStyle='rgba(4,6,26,.72)';g.fillRect(p.x-w/2-4,yy-10,w+8,14);g.fillStyle=c;g.fillText(t,p.x,yy+1)};\nconst shd=(cx,cz,rx,rz,y)=>{g.fillStyle='rgba(8,6,44,.6)';for(let i=-7;i<=7;i++)for(let j=-7;j<=7;j++){if(Math.abs(i+j)%2)continue;const a=i/7,b=j/7;if(a*a+b*b>1)continue;const p=proj(cx+a*rx,y,cz+b*rz);g.fillRect(p.x|0,p.y|0,2,2)}};\n\nlet n1=1.5,th=5,ang=30,kk=2,step=0,yaw=-0.7,pit=0.35,u=0;\nconst sci=(x,d=3)=>{if(!x)return'0';const e=Math.floor(Math.log10(Math.abs(x)));return (x/10**e).toFixed(d-1)+' × 10<sup>'+e+'<\/sup>'};\nconst sciT=(x,d=3)=>{if(!x)return'0';const e=Math.floor(Math.log10(Math.abs(x)));return (x/10**e).toFixed(d-1)+'e'+e};\nconst calc=()=>{const v1=C/n1,r=th/100/Math.cos(ang*Math.PI/180),t1=r/v1,t2=kk*t1,v2=r/t2,n2=C/v2;return{v1,r,t1,t2,v2,n2}};\nconst proj=(x,y,z)=>{\n let X=x*Math.cos(yaw)-z*Math.sin(yaw),Z=x*Math.sin(yaw)+z*Math.cos(yaw);\n let Y=y*Math.cos(pit)-Z*Math.sin(pit);Z=y*Math.sin(pit)+Z*Math.cos(pit);\n const s=3.2/(3.2+Z);return{x:W/2+X*s*84,y:H/2+12-Y*s*84,s}};\nconst px=(x,y,z,sz,col)=>{const p=proj(x,y,z);const q=Math.max(1,Math.round(sz*p.s*RS));const X=Math.round(p.x-q/2),Y=Math.round(p.y-q/2);g.fillStyle=col;g.fillRect(X,Y,q,q);if(q>=3){g.fillStyle=\"rgba(255,246,214,.42)\";g.fillRect(X,Y,q-1,1);g.fillRect(X,Y,1,q-1);g.fillStyle=\"rgba(22,10,70,.38)\";g.fillRect(X+1,Y+q-1,q-1,1);g.fillRect(X+q-1,Y+1,1,q-1)}};\nconst line=(a,b,col,n=24)=>{for(let i=0;i<=n;i++){const k=i/n;px(a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k,1,col)}};\nfunction slab(cx,col,lab){\n const x0=cx-.35,x1=cx+.35,y0=.3,y1=-.3,z0=-.55,z1=.55;\n const P=[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];\n [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(e=>line(P[e[0]],P[e[1]],col,18));\n for(let i=0;i<7;i++)for(let j=0;j<9;j++)if((i+j)%2==0)px(x0+i*.117,y0,z0+j*.137,1,col+'88');\n}\nconst NEXT='#ffd84d';\nfunction frame(){\n const k=calc();\n u=(u+0.004)%1.4; // 0..1.4 of longest time\n bg();\n for(let i=-5;i<=5;i++){line([i*.2,-.45,-1],[i*.2,-.45,1],'#1c2a52',10);line([-1,-.45,i*.2],[1,-.45,i*.2],'#1c2a52',10)}\n const two=step==3;\n const cxA=two?-.5:0,cxB=.5;\n slab(cxA,'#6fd0e8');if(two)slab(cxB,'#e8a06f');\n const off=.6*Math.tan(ang*Math.PI/180);const zo=Math.min(.55,off/2);\n const path=(cx,col,prog)=>{\n  const a=[cx,.3,-zo],b=[cx,-.3,zo];\n  line([cx,.55,-zo*1.9],a,'#ffffff55',8);line(b,[cx,-.55,zo*1.9],'#ffffff55',8);\n  line(a,b,col+'66',22);\n  line([cx,.3,0],[cx,-.3,0],'#ffffff33',8); // normal\n  const p=Math.min(1,prog);\n  const x=cx,y=.3-.6*p,z=-zo+2*zo*p;\n  if(prog<=1.15){for(let i=0;i<4;i++){const q=Math.max(0,p-i*.03);px(x,.3-.6*q,-zo+2*zo*q,6-i,i?col:'#fff')}}\n };\n const tA=1,tB=kk; // relative to t1\n const e=u*(two?kk:1)*1.0; // elapsed in units of t1\n path(cxA,two?'#6fd0e8':NEXT,e/tA);\n if(two)path(cxB,'#ffa05e',e/tB);\n // HUD\n const tmax=two?k.t2:k.t1,el=Math.min(e,two?kk:1)*k.t1;\n document.getElementById('hV').innerHTML=step==3?sci(k.v1,2)+' | '+sci(k.v2,2)+' m/s':sci(k.v1,3)+' m/s';\n document.getElementById('hR').textContent=(k.r*100).toFixed(2)+' cm';\n document.getElementById('hT').innerHTML=step>=2?sci(el,3)+' s':'—';\n\n const faces=(cx,c)=>{quad([[cx-.35,.3,-.55],[cx+.35,.3,-.55],[cx+.35,.3,.55],[cx-.35,.3,.55]],c,.2);quad([[cx-.35,-.3,.55],[cx+.35,-.3,.55],[cx+.35,.3,.55],[cx-.35,.3,.55]],c,.12);quad([[cx+.35,-.3,-.55],[cx+.35,-.3,.55],[cx+.35,.3,.55],[cx+.35,.3,-.55]],c,.16)};\n shd(cxA,0,.4,.6,-.45);faces(cxA,'#6fd0e8');\n if(two){shd(cxB,0,.4,.6,-.45);faces(cxB,'#e8a06f')}\n const gp=(cx,pr)=>{const p=Math.min(1,pr);return[cx,.3-.6*p,-zo+2*zo*p]};\n let a=gp(cxA,e);glow(a[0],a[1],a[2],18,'#ffd84d',.7);\n if(two){a=gp(cxB,e/kk);glow(a[0],a[1],a[2],18,'#ffa05e',.7)}\n glow(cxA,.3,-zo,12,'#fff',.35);\n lab('n₁ = '+n1.toFixed(2),cxA,.55,0,'#9fe8ff');\n if(two)lab('n₂ = ?',cxB,.55,0,'#ffb27a');\n lab('θ = '+ang+'°',cxA+.2,.42,-zo,'#fff');\n lab('r',cxA+.06,0,0,'#ffd84d',-6);\n lab(th+' cm',cxA+.4,0,-.55,'#cfe3ff',4);\n requestAnimationFrame(frame)}\nrequestAnimationFrame(frame);\n\nlet dr=null;\ncv.addEventListener('pointerdown',e=>{dr=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)});\ncv.addEventListener('pointermove',e=>{if(!dr)return;yaw+=(e.clientX-dr[0])*.01;pit=Math.max(-.2,Math.min(1,pit+(e.clientY-dr[1])*.008));dr=[e.clientX,e.clientY]});\ncv.addEventListener('pointerup',()=>dr=null);\n\nfunction render(){\n const k=calc(),ct=document.getElementById('card');\n document.getElementById('v1').textContent=n1.toFixed(2);\n document.getElementById('v2').textContent=th+' cm';\n document.getElementById('v3').textContent=ang+'°';\n document.getElementById('v4').textContent=kk;\n const S=[\n `<h2>الخطوة 1: سرعة الضوء داخل اللوح<\/h2>\n  <p>الضوء يبطئ داخل الزجاج، ومعامل الانكسار يقول لنا كم مرة أبطأ من سرعته في الفراغ.<\/p>\n  <div class=\"eq\">v = c / n<\/div>\n  <p class=\"why\">السبب: لإيجاد سرعة الضوء داخل الزجاج لأنها أقل من سرعة الضوء في الفراغ بمقدار معامل الانكسار n.<\/p>\n  <div class=\"eq\">v<sub>1<\/sub> = (3×10<sup>8<\/sup>) / ${n1.toFixed(2)} = ${sci(k.v1,3)} m/s<\/div>\n  <div class=\"res\">v<sub>1<\/sub> = <span>${sci(k.v1,3)} m/s<\/span><\/div>`,\n `<h2>الخطوة 2: طول المسار المائل r<\/h2>\n  <p>الشعاع المائل يقطع داخل اللوح مساراً أطول من السمك. انظر للخط الأصفر: هو أطول من الخط العمودي الباهت.<\/p>\n  <div class=\"eq\">r = thickness / cos θ<\/div>\n  <p class=\"why\">السبب: لتحديد طول المسار الذي يقطعه الضوء داخل اللوح. الكتاب يعامل الزاوية θ على أنها زاوية المسار داخل اللوح مع العمودي.<\/p>\n  <div class=\"eq\">r = ${(th/100).toFixed(2)} m / cos ${ang}° = ${(th/100).toFixed(2)} / ${Math.cos(ang*Math.PI/180).toFixed(3)} ≈ ${k.r.toFixed(4)} m<\/div>\n  <div class=\"res\">r ≈ <span>${k.r.toFixed(4)} m<\/span><\/div>\n  <p class=\"note\">الكتاب قرّب إلى 0.057 m عند السمك 5 cm.<\/p>`,\n `<h2>الفرع (a): زمن عبور اللوح الأول<\/h2>\n  <p>الضوء يسير بسرعة ثابتة داخل الوسط المتجانس، فالزمن = المسافة ÷ السرعة. راقب الساعة في الأعلى حتى تصل النبضة للأسفل.<\/p>\n  <div class=\"eq\">t = r / v<\/div>\n  <p class=\"why\">السبب: لأن الضوء يسير بسرعة ثابتة داخل الوسط المتجانس، فالزمن يساوي المسافة مقسومة على السرعة.<\/p>\n  <div class=\"eq\">t<sub>1<\/sub> = ${k.r.toFixed(4)} / ${sci(k.v1,2)} = ${sci(k.t1,3)} s<\/div>\n  <div class=\"res\">t<sub>1<\/sub> ≈ <span>${sci(k.t1,3)} s<\/span><\/div>\n  <p class=\"note\">عند القيم الأصلية الكتاب يعطي 0.0285×10<sup>−8<\/sup> s أي 2.85×10<sup>−10<\/sup> s، لأنه استخدم r = 0.057 m.<\/p>`,\n `<h2>الفرع (b): معامل انكسار المادة المجهولة<\/h2>\n  <p>اللوحان متماثلان بالسمك والمسار، لكن الأيمن (المجهول) أبطأ. الزمن عنده ضعف الزمن الأول، فسرعته نصف السرعة.<\/p>\n  <div class=\"eq\">t<sub>2<\/sub> = ${kk} t<sub>1<\/sub> = ${sci(k.t2,3)} s<\/div>\n  <div class=\"eq\">v<sub>2<\/sub> = r / t<sub>2<\/sub> = ${k.r.toFixed(4)} / ${sci(k.t2,3)} = ${sci(k.v2,3)} m/s<\/div>\n  <div class=\"eq\">n<sub>2<\/sub> = c / v<sub>2<\/sub> = (3×10<sup>8<\/sup>) / ${sci(k.v2,3)} = ${k.n2.toFixed(2)}<\/div>\n  <p class=\"why\">السبب: عند ثبوت المسار، إذا تضاعف الزمن قلّت السرعة إلى النصف، ومعامل الانكسار يتناسب طردياً مع الزمن، لذا n<sub>2<\/sub> = ${kk} × n<sub>1<\/sub>.<\/p>\n  <div class=\"res\">n<sub>2<\/sub> = <span>${k.n2.toFixed(2)}<\/span> (الأصل: 3)<\/div>`];\n ct.innerHTML=S[step]}\nconst bind=(id,fn)=>document.getElementById(id).oninput=e=>{fn(+e.target.value);u=0;render()};\nbind('s1',v=>n1=v);bind('s2',v=>th=v);bind('s3',v=>ang=v);bind('s4',v=>kk=v);\ndocument.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{\n step=+b.dataset.s;u=0;\n document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',x==b));render()});\nrender();\n<\/script>\n<\/body>\n<\/html>\n"}, {"n": "المسألة 4", "t": "سباق الموجات", "d": "فرق المسار وسمك الشريحة", "i": "paths", "html": "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>سباق الموجات إلى الشاشة – المسألة الرابعة<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#f3efe4;--panel:#fffdf6;--ink:#1d2433;--mute:#5d6577;--line:#cfc8b4;--acc:#1f8a5b;--hot:#d6442f;--box:#e9e3d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0e1424;--panel:#161e35;--ink:#e8ecf7;--mute:#97a1bd;--line:#2c3860;--acc:#5ef0a8;--hot:#ff7a5c;--box:#1d2745}}\n*{box-sizing:border-box}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;line-height:1.7}\nmain{max-width:760px;margin:0 auto;padding:16px}\nh1{font-size:1.5rem;margin:8px 0 4px;font-weight:800}\np.sub{margin:0 0 12px;color:var(--mute)}\ncanvas{width:100%;display:block;image-rendering:pixelated;border:3px solid var(--line);background:#0b1020;touch-action:none;cursor:grab}\n.hud{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}\n.hud div{flex:1 1 140px;background:var(--panel);border:2px solid var(--line);padding:6px 10px}\n.hud b{display:block;font-size:1rem;direction:ltr;text-align:right}\n.hud small{color:var(--mute)}\n.ctl{background:var(--panel);border:2px solid var(--line);padding:10px 12px;margin:8px 0}\n.ctl label{display:flex;justify-content:space-between;gap:10px;font-weight:700}\n.ctl input{width:100%;accent-color:var(--acc)}\n.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}\n.tabs button{flex:1 1 90px;font:inherit;font-weight:700;padding:8px 6px;border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}\n.tabs button[aria-pressed=\"true\"]{background:var(--acc);color:#06130d;border-color:var(--acc)}\n.tabs button:focus-visible,input:focus-visible{outline:3px solid var(--hot);outline-offset:2px}\n.card{background:var(--panel);border:2px solid var(--line);border-top:0;padding:12px 14px}\n.card h2{font-size:1.1rem;margin:0 0 6px}\n.why{color:var(--mute);margin:4px 0 8px}\n.eq{background:var(--box);padding:8px 10px;margin:6px 0;direction:ltr;text-align:left;overflow-x:auto;font-family:\"Cambria Math\",Georgia,serif;font-size:1.05rem;white-space:nowrap}\n.res{border-inline-start:6px solid var(--acc);background:var(--box);padding:8px 12px;margin-top:10px;font-weight:700}\n.res span{direction:ltr;unicode-bidi:isolate}\n.note{font-size:.9rem;color:var(--mute)}\n<\/style>\n<style id=\"polish\">\n:root{--bg:#f4f1ea;--panel:#ffffff;--ink:#14213d;--mute:#5b6478;--line:#ded7c6;--acc:#0f8b6d;--hot:#e4572e;--box:#f1ede2;--glow:rgba(15,139,109,.18)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0a0f1f;--panel:#121a33;--ink:#eaf0ff;--mute:#9aa6c7;--line:#25315a;--acc:#4ff0b0;--hot:#ff8a65;--box:#19244a;--glow:rgba(79,240,176,.16)}}\nbody{background:radial-gradient(900px 420px at 85% -10%,var(--glow),transparent 70%),var(--bg);letter-spacing:.1px}\nmain,#home{padding:18px 16px 28px}\nh1{font-size:1.65rem;letter-spacing:-.2px;position:relative;padding-inline-start:14px}\nh1::before{content:\"\";position:absolute;inset-inline-start:0;top:.28em;bottom:.28em;width:5px;border-radius:3px;background:linear-gradient(var(--acc),var(--hot))}\np.sub,.sub{font-size:.98rem;margin-bottom:14px}\ncanvas{border:2px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(10,15,40,.28),0 0 0 4px var(--glow)}\n.hud{gap:10px;margin:12px 0}\n.hud div{border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:0 2px 8px rgba(10,15,40,.08);border-top:3px solid var(--acc)}\n.hud small{font-size:.8rem;letter-spacing:.2px}\n.hud b{font-size:1.1rem;font-variant-numeric:tabular-nums;margin-top:2px}\n.ctl{border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 2px 10px rgba(10,15,40,.07)}\n.ctl label{margin-top:6px}\n.ctl label span{background:var(--box);border-radius:8px;padding:0 10px;font-variant-numeric:tabular-nums;color:var(--acc);font-weight:800}\n.ctl input[type=range]{height:28px;margin:2px 0 4px}\n.tabs{gap:8px;margin:16px 0 10px}\n.tabs button{border:1px solid var(--line);border-radius:12px;padding:10px 8px;box-shadow:0 2px 0 var(--line);transition:transform .12s,background .2s}\n.tabs button:active{transform:translateY(2px);box-shadow:none}\n.tabs button[aria-pressed=\"true\"]{box-shadow:0 4px 14px var(--glow);background:linear-gradient(135deg,var(--acc),#13b58c);color:#04120d}\n.card{border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 4px 18px rgba(10,15,40,.08)}\n.card h2{font-size:1.2rem;margin-bottom:8px;color:var(--ink)}\n.card p{margin:6px 0}\n.eq{border-radius:10px;border:1px solid var(--line);border-inline-start:4px solid var(--acc);padding:10px 14px}\n.why{border-inline-start:3px solid var(--line);padding-inline-start:10px}\n.res{border-inline-start:0;border:1px solid var(--acc);border-radius:12px;background:linear-gradient(135deg,var(--glow),transparent);padding:10px 14px}\n.note{line-height:1.7}\n.tile{border:1px solid var(--line)!important;border-radius:18px;box-shadow:0 6px 18px rgba(10,15,40,.12)!important;transition:transform .15s,box-shadow .2s;padding:16px 10px}\n.tile:hover{transform:translateY(-3px)}\n.tile:active{transform:scale(.98)!important}\n.tile svg{border-radius:14px;box-shadow:0 0 0 3px var(--glow)}\n.tile .n{font-size:.85rem;background:var(--box);border-radius:999px;padding:0 12px}\n#bar{border-bottom:1px solid var(--line)!important;box-shadow:0 2px 12px rgba(10,15,40,.12)}\n#back{border-radius:10px!important}\n.grid{gap:14px!important}\n<\/style>\n<\/head>\n<body>\n<main>\n<h1>سباق الموجات إلى الشاشة<\/h1>\n<p class=\"sub\">مصدر نقطي S ونقطتان A وB على الشاشة • اسحب المشهد لتدويره<\/p>\n\n<canvas id=\"cv\" width=\"360\" height=\"225\" aria-label=\"مشهد ثلاثي الأبعاد لمسارين ضوئيين من مصدر إلى نقطتين على شاشة\"><\/canvas>\n\n<div class=\"hud\">\n<div><small>N<sub id=\"lA\">SA<\/sub><\/small><b id=\"hA\">0<\/b><\/div>\n<div><small>N<sub>SB<\/sub><\/small><b id=\"hB\">0<\/b><\/div>\n<div><small id=\"lD\">الفرق<\/small><b id=\"hD\">0<\/b><\/div>\n<\/div>\n\n<div class=\"ctl\">\n<label>المسافة AB <span id=\"v1\"><\/span><\/label>\n<input id=\"s1\" type=\"range\" min=\"0.5\" max=\"3\" step=\"0.5\" value=\"1\" aria-label=\"المسافة بين A وB بالسنتيمتر\">\n<label>المسافة SA <span id=\"v2\"><\/span><\/label>\n<input id=\"s2\" type=\"range\" min=\"50\" max=\"200\" step=\"10\" value=\"100\" aria-label=\"المسافة بين المصدر والشاشة بالسنتيمتر\">\n<label>معامل انكسار الشريحة n<sub>g<\/sub> <span id=\"v3\"><\/span><\/label>\n<input id=\"s3\" type=\"range\" min=\"1.2\" max=\"2\" step=\"0.1\" value=\"1.5\" aria-label=\"معامل انكسار الشريحة\">\n<p class=\"note\" style=\"margin:6px 0 0\">الرسم مبسّط: المسافة بين A وB والشريحة مكبّرة كثيراً، والأعداد في الأعلى حقيقية (ملايين الموجات) وتُعدّ مع المربع الأبيض.<\/p>\n<\/div>\n\n<div class=\"tabs\" role=\"group\" aria-label=\"خطوات الحل\">\n<button data-s=\"0\" aria-pressed=\"true\">1. المسار SB<\/button>\n<button data-s=\"1\" aria-pressed=\"false\">2. الفرع (a)<\/button>\n<button data-s=\"2\" aria-pressed=\"false\">3. الفرع (b)<\/button>\n<\/div>\n<div class=\"card\" id=\"card\"><\/div>\n<\/main>\n\n<script>\nconst LAM=500e-9;\nconst cv=document.getElementById('cv'),g=cv.getContext('2d');\nconst W=cv.width,H=cv.height;\nconst RS=1.5;\nconst rgba=(c,a)=>{if(c[0]=='#'){const n=parseInt(c.slice(1,7),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}const m=c.match(/\\d+/g);return `rgba(${m[0]},${m[1]},${m[2]},${a})`};\nconst bg=()=>{const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#04061a');gr.addColorStop(.55,'#0c1535');gr.addColorStop(1,'#17234d');g.fillStyle=gr;g.fillRect(0,0,W,H);\n for(let i=0;i<90;i++){g.fillStyle=i%9?'rgba(170,195,255,.32)':'rgba(255,255,255,.85)';g.fillRect((i*97.3%W)|0,(i*53.7%(H*.55))|0,1,1)}\n const v=g.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,W*.68);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(2,3,18,.5)');g.fillStyle=v;g.fillRect(0,0,W,H)};\nconst glow=(x,y,z,r,c,a=.5)=>{const p=proj(x,y,z),R=Math.max(2,r*p.s*RS*.6);const gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,R);gr.addColorStop(0,rgba(c,a));gr.addColorStop(.4,rgba(c,a*.35));gr.addColorStop(1,rgba(c,0));g.globalCompositeOperation='lighter';g.fillStyle=gr;g.fillRect(p.x-R,p.y-R,2*R,2*R);g.globalCompositeOperation='source-over'};\nconst quad=(P,c,a)=>{g.fillStyle=rgba(c,a);g.beginPath();P.forEach((q,i)=>{const p=proj(q[0],q[1],q[2]);i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)});g.closePath();g.fill()};\nconst lab=(t,x,y,z,c,dy=-8)=>{const p=proj(x,y,z);g.font='bold '+Math.round(8*RS)+'px Tajawal,sans-serif';g.textAlign='center';const w=g.measureText(t).width,yy=p.y+dy*RS;g.fillStyle='rgba(4,6,26,.72)';g.fillRect(p.x-w/2-4,yy-10,w+8,14);g.fillStyle=c;g.fillText(t,p.x,yy+1)};\nconst shd=(cx,cz,rx,rz,y)=>{g.fillStyle='rgba(8,6,44,.6)';for(let i=-7;i<=7;i++)for(let j=-7;j<=7;j++){if(Math.abs(i+j)%2)continue;const a=i/7,b=j/7;if(a*a+b*b>1)continue;const p=proj(cx+a*rx,y,cz+b*rz);g.fillRect(p.x|0,p.y|0,2,2)}};\n\nlet AB=1,SA=100,ng=1.5,step=0,yaw=-0.75,pit=0.55,m=0;\nconst fmt=x=>Math.round(x).toLocaleString('en-US');\nconst calc=()=>{\n const sa=SA/100,ab=AB/100,sb=Math.hypot(sa,ab),NSA=sa/LAM,NSB=sb/LAM,dN=NSB-NSA;\n const dg=(sb-sa)/(ng-1);\n return{sa,ab,sb,NSA,NSB,dN,dg,NSAnew:(sa-dg)/LAM+dg*ng/LAM}};\nconst proj=(x,y,z)=>{\n let X=x*Math.cos(yaw)-z*Math.sin(yaw),Z=x*Math.sin(yaw)+z*Math.cos(yaw);\n let Y=y*Math.cos(pit)-Z*Math.sin(pit);Z=y*Math.sin(pit)+Z*Math.cos(pit);\n const s=3.2/(3.2+Z);return{x:W/2+X*s*84,y:H/2+9-Y*s*84,s}};\nconst px=(x,y,z,sz,col)=>{const p=proj(x,y,z);const q=Math.max(1,Math.round(sz*p.s*RS));const X=Math.round(p.x-q/2),Y=Math.round(p.y-q/2);g.fillStyle=col;g.fillRect(X,Y,q,q);if(q>=3){g.fillStyle=\"rgba(255,246,214,.42)\";g.fillRect(X,Y,q-1,1);g.fillRect(X,Y,1,q-1);g.fillStyle=\"rgba(22,10,70,.38)\";g.fillRect(X+1,Y+q-1,q-1,1);g.fillRect(X+q-1,Y+1,1,q-1)}};\nconst line=(a,b,col,n=24)=>{for(let i=0;i<=n;i++){const k=i/n;px(a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k,1,col)}};\nconst S0=[-.9,0,0],TA=[.9,0,0];\nfunction frame(now){\n const k=calc();\n const bz=Math.min(.7,.08+AB*.16),TB=[.9,0,bz];\n m=(m+(step?0.0022:0))%1.12;\n bg();\n for(let i=-5;i<=5;i++){line([i*.2,-.2,-1],[i*.2,-.2,1],'#1c2a52',10);line([-1,-.2,i*.2],[1,-.2,i*.2],'#1c2a52',10)}\n // screen\n for(let j=-6;j<=6;j++)for(let i=-3;i<=3;i++)px(.93,i*.06,j*.1,4,(i+j)%2?'#3a4670':'#4a5886');\n px(.9,0,0,6,'#ffd84d');px(.9,0,bz,6,'#ff7a5c');\n // source\n for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)px(-.92,i*.04,j*.04,3,'#ffffff');\n // paths\n line(S0,TA,'#2d6a8a',30);line(S0,TB,'#8a4a2d',30);\n const t=now/200,lamV=.1;\n const lenA=1.8,lenB=Math.hypot(1.8,bz);\n const slab=step==2;\n const sl0=.44,sl1=.56;\n const wave=(T,len,colr,withSlab)=>{\n  let ph=0;const N=170;\n  for(let i=0;i<=N;i++){const s=i/N;\n   if(i>0){const inS=withSlab&&s>sl0&&s<sl1;ph+=(len/N)/lamV*(inS?ng:1)}\n   const x=S0[0]+(T[0]-S0[0])*s,z=S0[2]+(T[2]-S0[2])*s;\n   px(x,Math.sin(2*Math.PI*ph-t)*.09,z,2,colr)}};\n wave(TA,lenA,'#6fd0e8',slab);wave(TB,lenB,'#ffa05e',false);\n if(slab){ // glass slab on path A\n  const x0=-.9+1.8*sl0,x1=-.9+1.8*sl1,h=.14;\n  const P=[[x0,-h,-h],[x1,-h,-h],[x1,h,-h],[x0,h,-h],[x0,-h,h],[x1,-h,h],[x1,h,h],[x0,h,h]];\n  [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(e=>line(P[e[0]],P[e[1]],'#e8d98a',8));\n }\n // sweep markers\n if(step>0&&m<=1){\n  const mm=m;\n  for(let y=-.1;y<=.1;y+=.04){px(S0[0]+1.8*mm,y,0,3,'#fff');px(S0[0]+(TB[0]-S0[0])*mm,y,TB[2]*mm,3,'#fff')}\n }\n const f=Math.min(1,m);\n if(step==0){document.getElementById('hA').textContent='—';document.getElementById('hB').textContent='—';document.getElementById('hD').textContent='—'}\n else if(step==1){\n  document.getElementById('lA').textContent='SA';document.getElementById('lD').textContent='الفرق ΔN';\n  document.getElementById('hA').textContent=fmt(k.NSA*f);document.getElementById('hB').textContent=fmt(k.NSB*f);document.getElementById('hD').textContent=fmt(k.dN*f)}\n else{\n  document.getElementById('lA').textContent='SA,new';document.getElementById('lD').textContent='الفرق بعد الشريحة';\n  document.getElementById('hA').textContent=fmt(k.NSAnew*f);document.getElementById('hB').textContent=fmt(k.NSB*f);document.getElementById('hD').textContent=fmt((k.NSB-k.NSAnew)*f)}\n\n shd(-.92,0,.12,.12,-.2);\n quad([[.93,-.18,-.6],[.93,-.18,.6],[.93,.18,.6],[.93,.18,-.6]],'#7a8ac8',.1);\n glow(-.92,0,0,44,'#fff',.7);glow(.9,0,0,22,'#ffd84d',.55);glow(.9,0,bz,22,'#ff7a5c',.55);\n lab('S',-.92,.2,0,'#fff');lab('A',.9,.16,0,'#ffd84d');lab('B',.9,.16,bz,'#ff9a7a');\n lab('SA = '+SA+' cm',-.1,.14,0,'#6fd0e8',-2);lab('SB = '+(k.sb*100).toFixed(3)+' cm',-.1,.14,bz*.44,'#ffa05e');\n lab('AB = '+AB+' cm',.9,-.1,bz*.5,'#fff',10);lab('SCREEN',.93,.34,-.45,'#8fb0ff');\n if(step>0&&m<=1){glow(-.9+1.8*m,0,0,18,'#fff',.6);glow(-.9+(TB[0]+.9)*m,0,TB[2]*m,18,'#fff',.6)}\n if(step==2){const x0=-.9+1.8*.44,x1=-.9+1.8*.56,h=.14;quad([[x0,-h,h],[x1,-h,h],[x1,h,h],[x0,h,h]],'#ffe9a8',.25);quad([[x0,h,-h],[x1,h,-h],[x1,h,h],[x0,h,h]],'#fff3c4',.3);lab('n_g = '+ng.toFixed(1),(x0+x1)/2,.25,0,'#ffe9a8')}\n requestAnimationFrame(frame)}\nrequestAnimationFrame(frame);\n\nlet dr=null;\ncv.addEventListener('pointerdown',e=>{dr=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)});\ncv.addEventListener('pointermove',e=>{if(!dr)return;yaw+=(e.clientX-dr[0])*.01;pit=Math.max(-.2,Math.min(1.2,pit+(e.clientY-dr[1])*.008));dr=[e.clientX,e.clientY]});\ncv.addEventListener('pointerup',()=>dr=null);\n\nfunction render(){\n const k=calc(),ct=document.getElementById('card');\n document.getElementById('v1').textContent=AB+' cm';\n document.getElementById('v2').textContent=SA+' cm';\n document.getElementById('v3').textContent=ng.toFixed(1);\n const S=[\n `<h2>الخطوة 1: طول المسار SB وعدد موجات كل مسار<\/h2>\n  <p>المسار SA عمودي على الشاشة، أما SB فمائل لأن B تبعد AB عن A. لذلك SB أطول قليلاً.<\/p>\n  <div class=\"eq\">SB = √( SA² + AB² ) = √(${SA}² + ${AB}²) = ${(k.sb*100).toFixed(3)} cm<\/div>\n  <p class=\"why\">السبب: المسار SA عمودي على الشاشة والمسافة AB تقع على الشاشة، فيتكوّن مثلث قائم الزاوية وتره هو SB.<\/p>\n  <div class=\"eq\">N = d / λ<\/div>\n  <p class=\"why\">السبب: لحساب عدد الأطوال الموجية الواقعة على كل مسار.<\/p>\n  <div class=\"eq\">N<sub>SB<\/sub> = ${k.sb.toFixed(5)} / (500×10<sup>−9<\/sup>) ≈ ${fmt(k.NSB)}<\/div>\n  <div class=\"eq\">N<sub>SA<\/sub> = ${k.sa.toFixed(2)} / (500×10<sup>−9<\/sup>) = ${fmt(k.NSA)}<\/div>\n  <p class=\"note\">الكتاب يكتبها 20001×10² و20000×10² عند القيم الأصلية.<\/p>`,\n `<h2>الفرع (a): الفرق في عدد الموجات<\/h2>\n  <p>اضغط التبويب وراقب العدّادات: المربع الأبيض يمسح المسارين، ويتجمع في النهاية فرق صغير جداً بين العددين.<\/p>\n  <div class=\"eq\">ΔN = N<sub>SB<\/sub> − N<sub>SA<\/sub><\/div>\n  <p class=\"why\">السبب: لإيجاد الفرق العددي بين موجات المسار الأطول (SB) وموجات المسار الأقصر (SA).<\/p>\n  <div class=\"eq\">ΔN = ${fmt(k.NSB)} − ${fmt(k.NSA)} ≈ ${fmt(k.dN)}<\/div>\n  <div class=\"res\">ΔN ≈ <span>${fmt(k.dN)}<\/span> موجة<\/div>\n  <p class=\"note\">عند القيم الأصلية تطلع 100 موجة، وهي فرق ضئيل جداً مقارنة بملايين الموجات.<\/p>`,\n `<h2>الفرع (b): سمك الشريحة الزجاجية d<sub>g<\/sub><\/h2>\n  <p>الشريحة (الصندوق الأصفر) توضع على المسار SA فتقصر الموجة داخلها وتزيد عدد موجاته حتى يتساوى العدد مع المسار SB.<\/p>\n  <div class=\"eq\">N<sub>SB<\/sub> = N<sub>SA,new<\/sub> = (SA − d<sub>g<\/sub>)/λ<sub>0<\/sub> + d<sub>g<\/sub>·n<sub>g<\/sub>/λ<sub>0<\/sub><\/div>\n  <p class=\"why\">السبب: الشريحة تحل محل جزء مساوٍ لها من الهواء، فينقص من الهواء d<sub>g<\/sub> وتزيد الموجات داخلها بسبب معامل الانكسار n<sub>g<\/sub>.<\/p>\n  <div class=\"eq\">${(k.sb*100).toFixed(3)} = ${SA} − d<sub>g<\/sub> + ${ng.toFixed(1)} d<sub>g<\/sub><\/div>\n  <div class=\"eq\">${(k.sb*100-SA).toFixed(3)} = ${(ng-1).toFixed(1)} d<sub>g<\/sub> ⟹ d<sub>g<\/sub> = ${(k.dg*100).toFixed(4)} cm<\/div>\n  <div class=\"res\">d<sub>g<\/sub> ≈ <span>${(k.dg*100).toFixed(4)} cm<\/span> = <span>${(k.dg*1e6).toFixed(0)} μm<\/span><\/div>\n  <p class=\"note\">عند القيم الأصلية d<sub>g<\/sub> = 10<sup>−2<\/sup> cm (أو 10<sup>−4<\/sup> m). التفسير: الشريحة زادت عدد الموجات في SA بمقدار 100 موجة ليعادل SB. شاهد العداد: الفرق يصير صفراً.<\/p>`];\n ct.innerHTML=S[step]}\nconst bind=(id,fn)=>document.getElementById(id).oninput=e=>{fn(+e.target.value);m=0;render()};\nbind('s1',v=>AB=v);bind('s2',v=>SA=v);bind('s3',v=>ng=v);\ndocument.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{\n step=+b.dataset.s;m=0;\n document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',x==b));render()});\nrender();\n<\/script>\n<\/body>\n<\/html>\n"}];
const ART={
bulb:["....yyyy....","...yyyyyy...","..yywwwwyy..","..ywwwwwwy..","..ywwwwwwy..","...yywwyy...","....yyyy....","....gggg....",".....gg.....","....gggg....","............","............"],
prism:["............","....pp......","...pppp.....","..pppppp....","..pppppp....",".pppppppp...","pppppppppp..","............","wwwwwww.....","............","............","............"],
slab:["............","..bbbbbbbb..","..bccccccb..","..bcyccccb..","..bccyccgb..","..bcccyccb..","..bccccyyb..","..bbbbbbbb..","............","............","............","............"],
paths:["............","............",".w..........","ww..........",".w..aaaaaaaa","...aa.......","..bb......ss","..bbbbbbbbbb","............","............","............","............"]};
const COL={y:'#ffd84d',w:'#ffffff',g:'#7d8597',p:'#b58cff',b:'#4da6ff',c:'#9be3f5',a:'#6fd0e8',s:'#ffa05e','.':null};
function icon(k){let r='';ART[k].forEach((row,y)=>[...row].forEach((ch,x)=>{let c=COL[ch];if(k=='paths'&&ch=='b')c='#ffa05e';if(k=='paths'&&ch=='s')c='#ffd84d';if(k=='prism'&&ch=='w')c='#ff6b6b';if(c)r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/>`}));return `<svg viewBox="0 0 12 12" aria-hidden="true"><rect width="12" height="12" fill="#0b1020"/>${r}</svg>`}
const grid=document.getElementById('grid');
ITEMS.forEach((it,i)=>{const b=document.createElement('button');b.className='tile';b.innerHTML=icon(it.i)+`<span class="n">${it.n}</span><b>${it.t}</b><small>${it.d}</small>`;b.onclick=()=>open(i);grid.appendChild(b)});

const home=document.getElementById('home'),view=document.getElementById('view'),fr=document.getElementById('fr');
function open(i){home.style.display='none';view.style.display='flex';document.getElementById('ttl').textContent=ITEMS[i].n+' – '+ITEMS[i].t;fr.srcdoc=ITEMS[i].html;scrollTo(0,0)}
document.getElementById('back').onclick=()=>{fr.srcdoc='';view.style.display='none';home.style.display='block'};
</script></body></html>
